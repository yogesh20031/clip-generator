[project]
name = "viral-clipper"
version = "0.1.0"
description = "Local MCP server that finds viral moments in long videos and cuts them into captioned 9:16 shorts"
authors = [{ name = "yogesh20031" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp>=2.3,<3",
    "pydantic>=2.11",
    "pyyaml>=6.0",
    "yt-dlp>=2026.10.26",
    "faster-whisper>=1.2",
    "scenedetect>=0.7.3",
    "librosa>=1.0",
    "opencv-python-headless>=4.11",
    "numpy>=2.0",
    "pillow>=11.0",
    "rich>=14.0",
    "anthropic>=0.80",
    "pysubs2>=1.8",
]

[project.optional-dependencies]
# Apple-Silicon GPU transcription. Install with: uv sync --extra mlx
mlx = ["mlx-whisper>=0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[project.scripts]
viral-clipper = "viral_clipper.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "anyio>=4.9",
    "ruff>=0.11",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: runs a real Whisper model or a real network download",
]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
