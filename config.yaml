# viral-clipper configuration. Copy any key into config.local.yaml (git-ignored) to override it.

paths:
  # Every processed video gets its own folder here: <output_dir>/<video-title>/
  # containing source.mp4 (downloads), clip_01.mp4 ..., clips.json, clips.csv, thumbnails/.
  output_dir: ~/Desktop/viral-clipper
  log_dir: logs
  font: assets/fonts/Montserrat-ExtraBold.ttf
  face_model: assets/models/face_detection_yunet_2023mar.onnx

whisper:
  # auto: mlx-whisper on Apple Silicon (if installed), else faster-whisper (CUDA if available, else CPU).
  backend: auto
  # auto: large-v3-turbo on a GPU backend, small on CPU. Any whisper size works (tiny ... large-v3).
  model: auto
  device: auto
  compute_type: auto
  language: null          # null = detect
  vad_filter: true
  beam_size: 5

analysis:
  rate_hz: 4              # grid for energy/motion curves
  motion_width: 160       # frames are downscaled to this width before frame-diff
  scene_adaptive_threshold: 3.0
  scene_min_len_s: 0.6
  silence_db: -40
  sentence_pause_s: 0.6
  spike_z: 2.5

clip:
  num_clips: 10
  min_len: 15
  max_len: 60
  min_gap_s: 2
  width: 1080
  height: 1920
  fps: 30
  crf: 18
  preset: medium
  audio_bitrate: 192k
  loudness_i: -14
  loudness_tp: -1
  loudness_lra: 11
  pre_roll_s: 0.3
  post_roll_s: 0.4

captions:
  enabled: true
  words_per_line: 3
  font_size: 84
  text_color: "#FFFFFF"
  highlight_color: "#FFE600"
  stroke_color: "#000000"
  stroke_width: 8
  y_ratio: 0.68
  uppercase: true
  hook_enabled: true
  hook_duration_s: 2.0
  hook_font_size: 92
  hook_y_ratio: 0.24
  hook_color: "#FFFFFF"
  hook_box_color: "#000000B0"

llm:
  # auto = use Anthropic when ANTHROPIC_API_KEY / an `ant auth login` profile exists, else templates.
  # Set to "none" to never call an API, or "anthropic" to fail loudly when credentials are missing.
  provider: auto
  model: claude-opus-5-5
  max_tokens: 4096
  fusion_weight: 0.6

platforms: [youtube_shorts, tiktok, instagram_reels, facebook_reels]
default_niche: generic
log_level: INFO
